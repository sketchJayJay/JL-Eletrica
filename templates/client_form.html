{% extends 'base.html' %}
{% set heading = 'Editar cliente' if client else 'Novo cliente' %}{% set subtitle='Dados principais para OS e orçamentos.' %}
{% block content %}<div class="card"><form method="post">
<div class="grid-2">
<div class="field"><label>Nome *</label><input name="name" required value="{{ client.name if client else '' }}"></div>
<div class="field"><label>CPF/CNPJ</label><input name="document" value="{{ client.document if client else '' }}"></div>
<div class="field"><label>Telefone / WhatsApp</label><input name="phone" value="{{ client.phone if client else '' }}"></div>
<div class="field"><label>E-mail</label><input type="email" name="email" value="{{ client.email if client else '' }}"></div>
<div class="field"><label>Endereço</label><input name="address" value="{{ client.address if client else '' }}"></div>
<div class="field"><label>Cidade</label><input name="city" value="{{ client.city if client else '' }}"></div>
</div><div class="field" style="margin-top:12px"><label>Observações</label><textarea name="notes">{{ client.notes if client else '' }}</textarea></div>
<div class="actions" style="margin-top:14px"><button class="btn btn-accent">Salvar</button><a class="btn btn-outline" href="/clientes">Cancelar</a></div>
</form></div>{% endblock %}
