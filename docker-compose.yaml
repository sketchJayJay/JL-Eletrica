services:
  jl-eletrica:
    build: .
    container_name: jl-eletrica
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-troque-esta-chave}
      - DATABASE_URL=sqlite:////app/data/jl_eletrica.db
    volumes:
      - jl_eletrica_data:/app/data

volumes:
  jl_eletrica_data:
